name: GenQuery Benchmark Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run deterministic benchmark
        run: python -m benchmark.runner --limit 20 --static --output benchmark-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: genquery-benchmark-report
          path: benchmark-report.json
